# Konfigurasi service Koyeb (dipakai saat deploy via git / `koyeb deploy`).
# Env runtime: isi di dashboard Koyeb (secrets) sesuai .env.example —
# TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, QSTASH_*, GROQ/OLLAMA,
# PASAL_API_TOKEN, GOOGLE_DRIVE_*, VAPID_PRIVATE_KEY.
# Build args NEXT_PUBLIC_APP_URL & NEXT_PUBLIC_VAPID_PUBLIC_KEY diisi di
# dashboard (Build → Build arguments) — atau tambahkan di bawah sebelum
# deploy pertama.

service:
  name: forfh
  routes:
    - path: /
      port: 3000
  health_checks:
    - path: /
      port: 3000
  build:
    dockerfile: Dockerfile
    context: .
